name: Deploy Study API

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rs-study-apir
  AZURE_CONTAINER_APP: study-apir-dev
  DOCKER_IMAGE: docker.io/acnaweb/study-api:latest

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$DOCKER_IMAGE"

      - name: Show deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "{name:name, status:properties.runningStatus, fqdn:properties.configuration.ingress.fqdn}" \
              --output table
