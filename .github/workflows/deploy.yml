name: Deploy Study API

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rs-study-apir
  AZURE_CONTAINER_APP: study-apir-dev
  AZURE_IMAGE: acnaweb/study-api:latest

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$AZURE_IMAGE"

      - name: Show Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "{name:name, provisioningState:properties.provisioningState, fqdn:properties.configuration.ingress.fqdn}" \
              --output table
